<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Opera Agent U-I Identity Hardening Fixture</title>
  <style>
    body { margin: 0; min-height: 900px; font-family: sans-serif; }
    #relocate-trigger { position: absolute; left: 8px; top: 260px; width: 160px; height: 32px; }
    #map-panel { position: absolute; left: 8px; top: 8px; width: 260px; height: 200px; overflow: auto; }
    #zoom-in { position: absolute; left: 100px; top: 60px; width: 120px; height: 36px; }
    #docs-heading { position: absolute; left: 8px; top: 420px; font-size: 18px; }
    #docs-save { position: absolute; left: 8px; top: 320px; width: 140px; height: 36px; }
  </style>
</head>
<body>
  <div id="map-panel">
    <button id="zoom-in" aria-label="Zoom in">Zoom in</button>
  </div>
  <button id="relocate-trigger" aria-label="Relocate control">Relocate control</button>
  <button id="docs-save" aria-label="Save">Save</button>
  <div id="docs-heading">Quarterly document</div>
  <script>
    document.getElementById('relocate-trigger').addEventListener('click', () => {
      // Maps-style redraw: the original control is destroyed and an identical
      // control appears at a different position.
      const moved = document.getElementById('zoom-in');
      const rect = moved.getBoundingClientRect();
      moved.remove();
      const clone = moved.cloneNode(true);
      clone.style.left = `${Math.round(rect.left) + 600}px`;
      document.body.appendChild(clone);
    });
  </script>
</body>
</html>
