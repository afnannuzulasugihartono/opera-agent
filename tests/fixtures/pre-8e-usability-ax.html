<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Opera Agent U-P1 AX Observation Fixture</title>
  <style>
    body { margin: 0; min-height: 400px; font-family: sans-serif; }
    #ax-heading { position: absolute; left: 8px; top: 8px; font-size: 13px; margin: 0; }
    #board { position: absolute; left: 8px; top: 40px; width: 320px; height: 180px; border: 1px solid #ccc; }
    #icon-ride { position: absolute; left: 8px; top: 240px; width: 140px; height: 36px; border: 0; background: #eee; padding: 0; }
    #shadow-host { position: absolute; left: 8px; top: 300px; width: 200px; height: 60px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    #ax-search { position: absolute; left: 160px; top: 240px; width: 120px; height: 28px; }
  </style>
</head>
<body>
  <h2 id="ax-heading">AX fixture</h2>
  <canvas id="board" role="application" aria-label="Design board" width="320" height="180"></canvas>
  <div class="sr-only" aria-live="polite">Canvas layer Cat uploaded</div>
  <button id="icon-ride" type="button" aria-label=""><img alt="Motorcycle, 3 minutes" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="></button>
  <input id="ax-search" type="text" value="typed secret text" aria-label="Search box" />
  <input id="ax-secret" type="password" value="hunter2" aria-label="Password" />
  <div id="stale-panel" style="position: absolute; left: 160px; top: 300px; width: 220px; height: 80px; border: 1px solid #ccc; padding: 4px">
    <span>Stale FAQ panel</span>
    <button id="panel-close" type="button" aria-label="Dismiss panel" onclick="document.getElementById('stale-panel').style.display='none'">×</button>
  </div>
  <div id="shadow-host"></div>
  <script>
    // Canvas-class surface: controls live inside an open shadow root so flat
    // document scans never see them, while the accessibility tree does.
    const host = document.getElementById('shadow-host');
    const root = host.attachShadow({ mode: 'open' });
    root.innerHTML = '<style>button{width:180px;height:40px}</style>'
      + '<button id="shadow-save" aria-label="Shadow save control"></button>';
    root.getElementById('shadow-save').addEventListener('click', () => {
      const marker = document.createElement('div');
      marker.id = 'shadow-clicked';
      marker.textContent = 'SavedByShadow';
      document.body.appendChild(marker);
    });
  </script>
</body>
</html>
