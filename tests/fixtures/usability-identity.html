<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Opera Agent Identity Hardening Fixture</title>
  <style>
    body { margin: 0; min-height: 900px; font-family: sans-serif; }
    #relocate-trigger { position: absolute; left: 8px; top: 260px; width: 160px; height: 32px; }
    #map-panel { position: absolute; left: 8px; top: 8px; width: 260px; height: 200px; overflow: auto; }
    #zoom-in { position: absolute; left: 100px; top: 60px; width: 120px; height: 36px; }
    #docs-heading { position: absolute; left: 8px; top: 420px; font-size: 18px; }
    #docs-save { position: absolute; left: 8px; top: 320px; width: 140px; height: 36px; }
    #docs-result { position: absolute; left: 8px; top: 370px; font-size: 14px; }
    #skip-ad { position: absolute; left: 8px; top: 560px; width: 120px; height: 36px; }
    #rerender-trigger { position: absolute; left: 8px; top: 610px; width: 170px; height: 32px; }
  </style>
</head>
<body>
  <div id="map-panel">
    <button id="zoom-in" aria-label="Zoom in">Zoom in</button>
  </div>
  <button id="relocate-trigger" aria-label="Relocate control">Relocate control</button>
  <button id="docs-save" aria-label="Save">Save</button>
  <div id="docs-heading">Quarterly document</div>
  <button id="skip-ad" aria-label="Skip">Skip</button>
  <button id="rerender-trigger" aria-label="Re-render control">Re-render control</button>
  <script>
    document.getElementById('relocate-trigger').addEventListener('click', () => {
      // Maps-style redraw: the original control is destroyed and an identical
      // control appears at a different position.
      const moved = document.getElementById('zoom-in');
      const rect = moved.getBoundingClientRect();
      moved.remove();
      const clone = moved.cloneNode(true);
      clone.style.left = `${Math.round(rect.left) + 600}px`;
      document.body.appendChild(clone);
    });
    document.getElementById('docs-save').addEventListener('click', () => {
      let result = document.getElementById('docs-result');
      if (!result) {
        result = document.createElement('div');
        result.id = 'docs-result';
        document.body.appendChild(result);
      }
      result.textContent = 'Saved';
    });
    document.getElementById('rerender-trigger').addEventListener('click', () => {
      // YouTube-style ad lifecycle: the original control (keyed by its DOM id)
      // is destroyed and an identical successor is recreated WITHOUT any id,
      // at the same position. The keyed pool empties; only a signature
      // fallback can keep the ref alive.
      const original = document.getElementById('skip-ad');
      const rect = original.getBoundingClientRect();
      original.remove();
      const successor = document.createElement('button');
      successor.setAttribute('aria-label', 'Skip');
      successor.textContent = 'Skip';
      successor.style.position = 'absolute';
      // Same DOCUMENT position as the original (convert viewport rect to
      // document coordinates) — the ad lifecycle recreates the control in
      // place, it does not move it.
      successor.style.left = `${Math.round(rect.left + window.scrollX)}px`;
      successor.style.top = `${Math.round(rect.top + window.scrollY)}px`;
      successor.style.width = `${Math.round(rect.width)}px`;
      successor.style.height = `${Math.round(rect.height)}px`;
      successor.addEventListener('click', () => {
        const result = document.createElement('div');
        result.id = 'skip-result';
        result.textContent = 'Skipped';
        document.body.appendChild(result);
      });
      document.body.appendChild(successor);
    });
  </script>
</body>
</html>
<script>
  // U-T (ETW): a delayed control appears 1.2s after load; clicking it appends
  // the etw-result marker. The watch scenario arms before it exists.
  setTimeout(() => {
    const late = document.createElement('button');
    late.id = 'etw-late-save';
    late.textContent = 'Late Save';
    late.addEventListener('click', () => {
      const marker = document.createElement('div');
      marker.id = 'etw-result';
      marker.textContent = 'SavedByWatcher';
      document.body.appendChild(marker);
    });
    document.body.appendChild(late);
  }, 1200);
</script>
