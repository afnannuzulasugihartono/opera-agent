# @last-edited: 2026-10-05 19:45 UTC+7.
# @title: .gitleaks — path-scoped allow exceptions for known synthetic fixtures.
# @state: every allowlisted path exists; the landing pages carry a publishable key, which is public by design.
# @dependencies: none stated.

# Path-scoped gitleaks allow exceptions.
# Rules stay enabled globally. Every entry pairs an EXACT path that still exists
# with the fixture pattern observed there, so a future real secret in the same
# file is still flagged. `detect --source .` scans full history, hence entries
# for paths that only appear in older commits.
#
# WHY the paths matter more than the patterns. This gate ran for the first time
# in CI on 2026-10-04 and immediately failed: the jwt allowlist pointed at a test
# file name that has since changed. An allowlist whose path is stale stops
# matching, which turns a known synthetic fixture back into a red gate, and the
# tempting fix -- editing the fixture to dodge the scanner -- is the wrong one.
# The same applies to every pattern below: renaming a symbol without renaming it
# here leaves the scanner blind to a real leak.

# Extend the built-in default config: default rules keep their regexes,
# and the allowlists below are appended to them.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
# Inherits all default generic-api-key attributes; entries only add allowlists.

  [[rules.allowlists]]
  description = "Chrome extension manifest 'key' is the public half pinned for a stable extension ID (Chrome docs); safe to commit. The v2/ copy stopped existing with the v2 tree, so the path list is the one that is still there."
  condition = "AND"
  paths = ['''^extension/manifest\.json$''']
  regexTarget = "line"
  regexes = [
    # Only the manifest key field carrying a public RSA key blob.
    '''"key":\s?"MIIBI''',
  ]

  [[rules.allowlists]]
  description = "SHA-256 review hashes recorded in a document are hashes of local test artifacts, not credentials. The path is a glob because the two checkpoint docs it was written for are gone and the pattern they matched is not specific to them."
  condition = "AND"
  paths = ['''^docs/.*\.md$''']
  regexTarget = "line"
  regexes = [
    '''- (SQL|Token|Token tests|Native tests): `[0-9a-f]{64}`''',
    '''nonsecret client ID:''',
  ]

  [[rules.allowlists]]
  description = "Migration feature-flag key names are identifiers, not secrets."
  condition = "AND"
  paths = ['''^supabase/migrations/.*\.sql$''']
  regexTarget = "line"
  regexes = [
    '''key = .milestone[67]_(ledger|vm)_enabled.''',
  ]

  [[rules.allowlists]]
  # WHY this one exists: gitleaks ran on this tree on 2026-10-05 and reported four leaks
  # that are not leaks. A Supabase publishable key is public by design -- it is the
  # counterpart of a secret key and the whole product is a client-side site whose only
  # boundary is RLS, so it has to be in the page. The management token is not, and is not
  # in the tree.
  #
  # The regex is the assignment and the publishable prefix together, so a different
  # credential appearing on any of these pages is still reported.
  description = "Supabase publishable key, public by design and required in a client-side page; the secret key and the management token are not in the tree."
  condition = "AND"
  paths = ['''^landing/.*\.html$''']
  regexTarget = "line"
  regexes = [
    '''PUBLISHABLE_KEY\s*=\s*.sb_publishable_''',
  ]

[[rules]]
id = "jwt"
# Inherits all default jwt attributes; no allowlist: the test that needed one is gone.
