# Enterprise Phase 1 Task 7: path-scoped gitleaks allow exceptions.
# Rules stay enabled globally. Every entry pairs an EXACT historical path
# with the fixture pattern observed there, so a future real secret in the
# same file is still flagged. Findings verified 2026-09-30 with gitleaks
# 8.24.0 (`detect --source .` scans full history, hence historical commits).

# Extend the built-in default config: default rules keep their regexes,
# and the allowlists below are appended to them.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
# Inherits all default generic-api-key attributes; entries only add allowlists.

  [[rules.allowlists]]
  description = "Chrome extension manifest 'key' is the public half pinned for a stable extension ID (Chrome docs); safe to commit."
  condition = "AND"
  paths = ['''^extension/manifest\.json$''', '''^v2/extension/manifest\.json$''']
  regexTarget = "line"
  regexes = [
    # Only the manifest key field carrying a public RSA key blob.
    '''"key":\s?"MIIBI''',
  ]

  [[rules.allowlists]]
  description = "8D edge scripts reference key names (not values): --allow-env lists, $env: assignments from runtime vars/null, and a publishable-key param default. Publishable keys are public-by-design; the management token is read from env/local credential file at runtime (Get-ManagementToken)."
  condition = "AND"
  paths = ['''^scripts/run-8d-edge-concurrency\.ps1$''', '''^scripts/run-8d-acceptance\.ps1$''']
  regexTarget = "line"
  regexes = [
    '''--allow-env=OPERA_8D_MANAGEMENT_TOKEN,OPERA_8D_PUBLISHABLE_KEY''',
    '''\$env:OPERA_8D_(MANAGEMENT_TOKEN|PUBLISHABLE_KEY) = \$(token|PublishableKey|null)''',
    '''\$PublishableKey = .sb_publishable_''',
  ]

  [[rules.allowlists]]
  description = "Checkpoint evidence docs record SHA-256 review hashes of local test artifacts and one explicitly labeled nonsecret client ID; hashes attest file content, they are not credentials."
  condition = "AND"
  paths = ['''^docs/milestone-8-checkpoint-8d-journal-candidate\.md$''', '''^docs/milestone-8-checkpoint-8d-cloud-bounds\.md$''']
  regexTarget = "line"
  regexes = [
    '''- (SQL|Token|Token tests|Native tests): `[0-9a-f]{64}`''',
    '''nonsecret client ID:''',
  ]

  [[rules.allowlists]]
  description = "Migration feature-flag key names are identifiers, not secrets."
  condition = "AND"
  paths = ['''^supabase/migrations/.*\.sql$''']
  regexTarget = "line"
  regexes = [
    '''key = .milestone[67]_(ledger|vm)_enabled.''',
  ]

[[rules]]
id = "jwt"
# Inherits all default jwt attributes; entry only adds an allowlist.

  [[rules.allowlists]]
  description = "Admission test uses a synthetic JWT-shaped fixture explicitly suffixed public_fixture_signature."
  condition = "AND"
  paths = ['''^tests/transaction-cloud-8d\.test\.mjs$''']
  regexes = ['''public_fixture_signature''']
