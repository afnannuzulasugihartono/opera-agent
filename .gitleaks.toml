# @last-edited: 2026-10-05 19:45 UTC+7.
# @title: .gitleaks — path-scoped allow exceptions for known synthetic fixtures.
# @state: every allowlisted path exists; the landing pages carry a publishable key, which is public by design.
# @dependencies: none stated.

# Path-scoped gitleaks allow exceptions.
# Rules stay enabled globally.
# Every entry pairs an EXACT path that still exists with the fixture pattern observed there, so a future real secret in the same file is still flagged.
# `detect --source .` scans full history, hence entries for paths that only appear in older commits.

# WHY the paths matter more than the patterns.
# This gate ran for the first time in CI on 2026-10-04 and immediately failed: the jwt allowlist pointed at a test file name that has since changed.
# An allowlist whose path is stale stops matching, which turns a known synthetic fixture back into a red gate, and the tempting fix -- editing the fixture to dodge the scanner -- is the wrong one.
# The same applies to every pattern below: renaming a symbol without renaming it here leaves the scanner blind to a real leak.

# Extend the built-in default config: default rules keep their regexes, and the allowlists below are appended to them.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Chrome extension manifest 'key' is the public half pinned for a stable extension ID (Chrome docs); safe to commit. The v2/ copy stopped existing with the v2 tree, so the path list is the one that is still there."
  condition = "AND"
  paths = ['''^extension/manifest\.json$''']
  regexTarget = "line"
  regexes = [

    '''"key":\s?"MIIBI''',
  ]

  [[rules.allowlists]]
  description = "SHA-256 review hashes recorded in a document are hashes of local test artifacts, not credentials. The path is a glob because the two checkpoint docs it was written for are gone and the pattern they matched is not specific to them."
  condition = "AND"
  paths = ['''^docs/.*\.md$''']
  regexTarget = "line"
  regexes = [
    '''- (SQL|Token|Token tests|Native tests): `[0-9a-f]{64}`''',
    '''nonsecret client ID:''',
  ]

  [[rules.allowlists]]
  description = "Migration feature-flag key names are identifiers, not secrets."
  condition = "AND"
  paths = ['''^supabase/migrations/.*\.sql$''']
  regexTarget = "line"
  regexes = [
    '''key = .milestone[67]_(ledger|vm)_enabled.''',
  ]

  [[rules.allowlists]]

  description = "Supabase publishable key, public by design and required in a client-side page; the secret key and the management token are not in the tree."
  condition = "AND"
  paths = ['''^landing/.*\.html$''']
  regexTarget = "line"
  regexes = [
    '''PUBLISHABLE_KEY\s*=\s*.sb_publishable_''',
  ]

  [[rules.allowlists]]

  description = "The RFC 6455 sample handshake nonce in the bridge tests. It is the specification's own example - 'the sample nonce', base64 - and it authenticates nothing: the server accepts any sixteen-byte key. The live tree uses sixteen zero bytes; these entries exist because `detect --source .` reads the commits that carried the spec literal."
  condition = "AND"
  paths = [
    '''^tests/bridge-server\.test\.mjs$''',
    '''^tests/local-bridge\.test\.mjs$''',
  ]
  regexTarget = "line"
  regexes = [
    '''Sec-WebSocket-Key.: .dGhlIHNhbXBsZSBub25jZQ==''',
  ]

  [[rules.allowlists]]

  description = "The same publishable key inside one reverted experiment migration, kept as history. The live tree carries no key in migrations; a secret here in any other migration file is still flagged."
  condition = "AND"
  paths = ['''^supabase/migrations/20261012100000_opera_agent_command_insert_signal\.sql$''']
  regexTarget = "line"
  regexes = [
    '''apikey., .sb_publishable_''',
  ]

[[rules]]
id = "jwt"

# WHY THESE FIVE ARE ALLOWED BY VALUE AND NOT BY PATH.
# Each fixture below lived in a file that has since been deleted, so a path-scoped entry cannot name it: the hygiene gate requires every allowlist path to be a tracked file, and `detect --source .` still reads the commits that held them.
# So they are allowed by their literal, which is the narrowest thing that can silence a commit - each is a specification example, a public half of a key, or a fixture whose payload starts with a field name a real Supabase token does not carry.

[allowlist]
description = "Fixtures that only exist in history: two deleted 8D drill scripts, the deleted v2 manifest copy, and two deleted transaction-cloud tests."
condition = "OR"
regexTarget = "line"
regexes = [
  '''dGhlIHNhbXBsZSBub25jZQ==''',
  '''eyJhbGciOiJIUzI1NiJ9\.eyJyb2xlI''',
  '''PublishableKey\s*=\s*.sb_publishable_''',
  '''OPERA_8D_MANAGEMENT_TOKEN,OPERA_8D_PUBLI''',
  '''"key":\s?"MIIBI''',
]
