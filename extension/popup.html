<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opera Agent</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="app-header">
      <div class="brand-mark" aria-hidden="true">OA</div>
      <div class="brand-copy">
        <p class="eyebrow">Local browser bridge</p>
        <h1>Opera Agent</h1>
        <p id="version">&nbsp;</p>
      </div>
      <span id="statusBadge" class="badge starting" aria-live="polite">Starting</span>
    </header>

    <section class="card status-card" aria-labelledby="statusTitle">
      <div class="section-heading">
        <h2 id="statusTitle">Status</h2>
        <span class="secure-label">Local only</span>
      </div>
      <dl class="details">
        <div class="row"><dt>Device</dt><dd id="deviceName">opera</dd></div>
        <div class="row"><dt>Connection</dt><dd id="connection">&mdash;</dd></div>
        <div class="row"><dt>Last command</dt><dd id="lastCommand">&mdash;</dd></div>
        <div class="row"><dt>Vision</dt><dd id="visionPrivacy" class="privacy allowed">Allowed</dd></div>
      </dl>
      <p id="error" class="error" role="alert" hidden></p>
    </section>

    <section id="pairSection" class="card" aria-labelledby="pairTitle">
      <div class="section-heading">
        <h2 id="pairTitle">Connect device</h2>
      </div>
      <label for="pairCode">One-time pairing code</label>
      <input id="pairCode" type="text" autocomplete="off" spellcheck="false" maxlength="64" placeholder="Enter pairing code" />
      <button id="pairButton" class="primary">Pair device</button>
      <p class="hint">Generate the code from Opera Agent, then enter it here once.</p>
    </section>

    <section id="pairedSection" class="card controls-card" aria-labelledby="controlsTitle" hidden>        <div class="section-heading">
          <h2 id="controlsTitle">Device controls</h2>
        </div>
      <div class="button-stack">
        <button id="privateTabButton" class="secondary">Mark current tab private</button>
        <button id="selfTestButton" class="secondary">Run self-test</button>
        <button id="unpairButton" class="danger">Unpair device</button>
      </div>
      <pre id="selfTestResult" aria-live="polite" hidden></pre>
    </section>

    <footer>Private by design &middot; Background-first &middot; Local execution</footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
