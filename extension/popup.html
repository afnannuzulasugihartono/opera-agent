<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opera Agent</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Opera Agent</h1>
        <p id="version">1.0.1</p>
      </div>
      <span id="statusBadge" class="badge">Starting</span>
    </header>

    <section class="card">
      <div class="row"><span>Device</span><strong id="deviceName">opera</strong></div>
      <div class="row"><span>Connection</span><strong id="connection">starting</strong></div>
      <div class="row"><span>Last command</span><strong id="lastCommand">—</strong></div>
    </section>

    <section id="pairingCard" class="card hidden">
      <label for="pairCode">Pairing code</label>
      <input id="pairCode" autocomplete="off" maxlength="64" spellcheck="false" />
      <button id="pairButton" type="button">Pair device</button>
    </section>

    <section id="readyCard" class="card hidden">
      <button id="testButton" type="button">Run self-test</button>
      <button id="unpairButton" class="secondary" type="button">Unpair device</button>
    </section>

    <p id="message" class="message" aria-live="polite"></p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
