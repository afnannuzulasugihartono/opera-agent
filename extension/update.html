<!-- @title: update - the page where the reader allows the extension to write its own folder. -->
<!-- @state: the flat dark panel, same shape as the popup; every word comes from lib/i18n.js. -->
<!-- @dependencies: lib/i18n.js, worker/self-update.js. -->

<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="update.title">Update otomatis — Opera Agent</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* WHY THE GATE IS THE POPUP'S SHAPE: one panel for one decision, read in a second, not a page to be read end to end. */
    body.gatePage {
      width: 400px;
      margin: 0;
      padding: 0;
      border-radius: 0;
      overflow: visible;
      border: 0;
      box-shadow: none;
      background: var(--pop-bg);
      min-height: 100vh;
    }
  </style>
</head>
<body class="popup gatePage">
  <main class="shell">
    <header class="topbar">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="16" height="16" rx="3" fill="#0b0d10"/><path d="M5.2 2.2v10.2l2.5-2.3 1.5 3.6 1.9-.8-1.6-3.6h3.1L5.2 2.2Z" fill="#3ecf8e"/></svg></span>
      <h1 class="topbarName" data-i18n="doors.updateAuto">Update otomatis</h1>
      <span class="topbarVersion">Opera Agent</span>
    </header>

    <p id="gateState" class="statusLine pending" aria-live="polite">…</p>

    <div class="rows">
      <button id="gatePick" class="rowAmber" type="button">
        <span class="rowIcon" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1.5 5.5A1.5 1.5 0 0 1 3 4h3l1.5 2h5.5A1.5 1.5 0 0 1 14.5 7.5v5A1.5 1.5 0 0 1 13 14H3a1.5 1.5 0 0 1-1.5-1.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></span>
        <span class="rowBody"><span id="gatePickText" class="rowText">Izinkan folder extension</span></span>
      </button>
      <button id="gateUpdate" class="menuItem accentRow" type="button" hidden>
        <span class="rowIcon" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 1.5v8m0 0L5 6.8M8 9.5l3-2.7M3 13.5h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="rowBody"><span class="rowText" data-i18n="doors.updateNow">Perbarui sekarang</span></span>
      </button>
      <button id="gateForget" class="menuItem dangerRow" type="button" hidden>
        <span class="rowIcon" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 4h12M6.5 4V2.5h3V4M4 4l.8 9.5A1.4 1.4 0 0 0 6.2 14.5h3.6a1.4 1.4 0 0 0 1.4-1.5L12 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="rowBody"><span class="rowText" data-i18n="doors.forgetFolder">Lupakan folder</span></span>
      </button>
    </div>

    <p class="hint explain" data-i18n="update.closeable">Halaman ini boleh ditutup. Worker extension pull update seperti git pull — tanpa unduh, tanpa muat ulang manual.</p>

    <p id="gateError" class="error" hidden></p>

    <footer class="footbar">
      <span class="footBrand" data-i18n="footer.brand">Privasi sejak awal. Berjalan di latar.</span>
      <span class="footText">
        <a class="footLinkText" href="https://opera-agent.pages.dev/docs.html" target="_blank" rel="noreferrer" data-i18n="footer.help">Bantuan</a>
        <span class="footSep" aria-hidden="true">|</span>
        <a class="footLinkText" href="https://github.com/afnannuzulasugihartono/opera-agent/blob/main/CHANGELOG.md" target="_blank" rel="noreferrer" data-i18n="footer.changes">Perubahan</a>
      </span>
      <a class="footLink" href="https://github.com/afnannuzulasugihartono/opera-agent" target="_blank" rel="noreferrer" data-i18n-aria="footer.source" aria-label="Kode sumber di GitHub"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.27-.01-1.17-.02-2.24-3.2.7-3.87-1.37-3.87-1.37-.52-1.33-1.27-1.69-1.27-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.76 2.68 1.25 3.34.96.1-.74.4-1.25.72-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.04 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.84 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.58.24 2.75.12 3.04.74.81 1.18 1.83 1.18 3.09 0 4.41-2.69 5.38-5.25 5.66.41.36.77 1.06.77 2.14 0 1.54-.01 2.79-.01 3.17 0 .31.21.68.8.56A10.5 10.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/></svg></a>
    </footer>
  </main>

  <script type="module" src="worker/self-update.js"></script>
</body>
</html>
