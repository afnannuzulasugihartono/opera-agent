# @title: config — Supabase backend.
# @state: the consent screen lives on the site, at /oauth/consent.
# @dependencies: none stated.

project_id = "opera-agent"

[auth]
# WHY the site and not a separate deployment: GoTrue validates the origin of every
# consent API call against this value, so a consent screen on another host can never
# approve an authorization. Pointing it at the site is what lets one origin serve it.
#
# WHY Cloudflare: the site moved to Pages because Vercel Hobby's hundred deploys
# a day went on ordinary pushes. The Vercel origin stays in the redirect list
# below so a login that started there is not thrown away mid-migration.
site_url = "https://opera-agent.pages.dev"

[auth.emailRedirect]
# The old host stays allowed while installs in the wild still point at it.
redirect_urls = ["https://opera-agent.pages.dev", "https://opera-agent.vercel.app"]

[auth.oauth_server]
enabled = true
authorization_path = "/oauth/consent"
allow_dynamic_registration = true
