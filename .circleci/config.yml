version: 2.1

orbs:
  node: circleci/node@7.2.1
  python: circleci/python@2.0.3

jobs:
  test:
    executor:
      name: python/default
      tag: "3.12"
    resource_class: medium
    steps:
      - checkout
      - node/install:
          node-version: "22.20.0"
          install-yarn: false
      - run:
          name: Verify runtime versions
          command: |
            node --version
            python --version
            node -e "if (Number(process.versions.node.split('.')[0]) !== 22) process.exit(1)"
            python -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 1)"
      - run:
          name: Unit and static tests
          command: |
            npm test
            npm run check
      - run:
          name: Install Playwright
          command: |
            python -m pip install --upgrade pip
            pip install playwright
            python -m playwright install --with-deps chromium
      - run:
          name: Chromium extension regression
          command: xvfb-run -a env OA_BROWSER_HEADLESS=0 python tests/browser_extension_test.py

  repowise_r6_validation:
    executor:
      name: python/default
      tag: "3.12"
    resource_class: medium
    environment:
      DO_NOT_TRACK: "1"
      REPOWISE_TELEMETRY_DISABLED: "1"
      REPOWISE_SKIP_EDITOR_SETUP: "1"
      REPOWISE_NO_SAVE_KEY: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - checkout
      - run:
          name: Hydrate full git history
          command: |
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              git fetch --unshallow origin
            fi
            git config --unset-all remote.origin.partialclonefilter || true
            git fetch --refetch origin '+refs/heads/*:refs/remotes/origin/*' --tags
            git config --unset-all remote.origin.promisor || true
            if git config --get-regexp "^remote\\..*\\.(promisor|partialclonefilter)" >/dev/null; then
              echo "Partial-clone config remains after hydration."
              exit 1
            fi
            if git rev-list --objects --all --missing=print | grep -q '^?'; then
              echo "Missing Git objects remain after hydration."
              exit 1
            fi
      - run:
          name: Install pinned Repowise locally
          command: python tools/repowise/bootstrap.py
      - run:
          name: Build privacy-hardened R6 index
          command: |
            env -u ANTHROPIC_API_KEY -u OPENAI_API_KEY -u GEMINI_API_KEY -u GOOGLE_API_KEY -u OPENROUTER_API_KEY -u DEEPSEEK_API_KEY \
              DO_NOT_TRACK=1 \
              REPOWISE_TELEMETRY_DISABLED=1 \
              REPOWISE_SKIP_EDITOR_SETUP=1 \
              REPOWISE_NO_SAVE_KEY=1 \
              .repowise-venv/bin/repowise init . --yes --no-prose --no-editor-setup --no-save-key --embedder mock
      - run:
          name: Run R6 validation benchmark
          command: |
            mkdir -p /tmp/repowise-r6
            .repowise-venv/bin/python tools/repowise/r6_validate.py /tmp/repowise-r6/report.json
      - store_artifacts:
          path: /tmp/repowise-r6/report.json
          destination: repowise-r6-report.json

workflows:
  ci:
    jobs:
      - test
      - repowise_r6_validation:
          filters:
            branches:
              only: chore/repowise-integration
