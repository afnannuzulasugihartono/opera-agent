version: 2.1

orbs:
  node: circleci/node@7.2.1
  python: circleci/python@2.0.3

jobs:
  test:
    executor:
      name: python/default
      tag: "3.12"
    resource_class: medium
    steps:
      - checkout
      - node/install:
          node-version: "22.20.0"
          install-yarn: false
      - run:
          name: Verify runtime versions
          command: |
            node --version
            python --version
            node -e "if (Number(process.versions.node.split('.')[0]) !== 22) process.exit(1)"
            python -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 1)"
      - run:
          name: Unit and static tests
          command: |
            npm test
            npm run check
      - run:
          name: Install Playwright
          command: |
            python -m pip install --upgrade pip
            pip install playwright
            python -m playwright install --with-deps chromium
      - run:
          name: Chromium extension regression
          command: xvfb-run -a env OA_BROWSER_HEADLESS=0 python tests/browser_extension_test.py

  repowise_r4_mcp:
    executor:
      name: python/default
      tag: "3.12"
    resource_class: medium
    environment:
      DO_NOT_TRACK: "1"
      REPOWISE_TELEMETRY_DISABLED: "1"
      REPOWISE_SKIP_EDITOR_SETUP: "1"
      REPOWISE_NO_SAVE_KEY: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - checkout
      - run:
          name: Install pinned Repowise locally
          command: python tools/repowise/bootstrap.py
      - run:
          name: Build privacy-hardened local index
          command: |
            .repowise-venv/bin/repowise init . --yes --no-prose --no-editor-setup --no-save-key --embedder mock
      - run:
          name: R4 MCP stdio acceptance smoke
          command: .repowise-venv/bin/python tools/repowise/mcp_smoke.py

workflows:
  ci:
    jobs:
      - test
      - repowise_r4_mcp:
          filters:
            branches:
              only: chore/repowise-integration
