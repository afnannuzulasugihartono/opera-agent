version: 2.1

orbs:
  node: circleci/node@7.2.1
  python: circleci/python@2.0.3

jobs:
  test:
    executor:
      name: python/default
      tag: "3.12"
    resource_class: medium
    steps:
      - checkout
      - node/install:
          node-version: "22.20.0"
          install-yarn: false
      - run:
          name: Verify runtime versions
          command: |
            node --version
            python --version
            node -e "if (Number(process.versions.node.split('.')[0]) !== 22) process.exit(1)"
            python -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 1)"
      - run:
          name: Unit and static tests
          command: |
            npm test
            npm run check
      - run:
          name: Install Playwright
          command: |
            python -m pip install --upgrade pip
            pip install playwright
            python -m playwright install --with-deps chromium
      - run:
          name: Chromium extension regression
          command: xvfb-run -a env OA_BROWSER_HEADLESS=0 python tests/browser_extension_test.py

  repowise_r3:
    executor:
      name: python/default
      tag: "3.12"
    resource_class: medium
    environment:
      DO_NOT_TRACK: "1"
      REPOWISE_TELEMETRY_DISABLED: "1"
      REPOWISE_SKIP_EDITOR_SETUP: "1"
      REPOWISE_NO_SAVE_KEY: "1"
      REPOWISE_GIT_WINDOW_ANCHOR: "head"
      PYTHONIOENCODING: "utf-8"
    steps:
      - checkout
      - run:
          name: Fetch full git history
          command: git fetch --unshallow || git fetch --all --tags --prune
      - run:
          name: Install pinned Repowise locally
          command: python tools/repowise/bootstrap.py
      - run:
          name: Run privacy-hardened R3 index probe
          command: |
            mkdir -p /tmp/repowise-r3
            python tools/repowise/r3_probe.py --report /tmp/repowise-r3/report.json
            cat /tmp/repowise-r3/report.json
      - store_artifacts:
          path: /tmp/repowise-r3/report.json
          destination: repowise-r3-report.json
      - run:
          name: Publish metrics-only evidence branch when permitted
          command: |
            cp /tmp/repowise-r3/report.json docs/repowise-r3-index-evidence.json
            git add docs/repowise-r3-index-evidence.json
            git config user.name "Opera Agent CI"
            git config user.email "ci@users.noreply.github.com"
            git commit -m "docs(repowise): capture R3 index evidence [skip ci]"
            GIT_SSH_COMMAND="ssh -o BatchMode=yes" git push origin HEAD:refs/heads/repowise-r3-evidence --force || true
      - run:
          name: Assert R3 verification
          command: python tools/repowise/r3_assert.py /tmp/repowise-r3/report.json

workflows:
  ci:
    jobs:
      - test
      - repowise_r3:
          filters:
            branches:
              only: chore/repowise-integration
