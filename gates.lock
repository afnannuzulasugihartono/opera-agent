# gates.lock — the acceptance surface, pinned so the judge cannot move with the judged.
#
# THE ROOT OF TRUST IS NOT IN THIS FILE, and it is worth being exact about why.
#
# An agent that edits code can also edit the code that checks the code. That is
# not a bug to be engineered away inside the repository; it is the structural
# limit of any in-tree gate. Something has to sit outside the thing it judges, or
# the chain is only the judge congratulating itself. So there are two layers, and
# only the first is ours to maintain:
#
#   Layer 1 (this file). Every file that DEFINES an acceptance criterion is
#   pinned here by git-blob SHA1, LF-normalized so a Windows checkout agrees with
#   CI. Changing one without deliberately re-pinning it fails `npm run check`
#   before anything else runs. That does not stop a determined edit; it stops a
#   SILENT one, and it forces the admission into the diff, where a reviewer can
#   catch it.
#
#   Layer 2 (the owner). .github/CODEOWNERS names these same paths and branch
#   protection on main makes them owner-approvable only. THIS is the root of
#   trust. An agent cannot grant itself review rights, and no hash written here
#   can take that authority away. If you want one control that an AI genuinely
#   cannot edit, it is that setting, not this file.
#
# WHY a file earns a pin: it decides whether a change is correct (accepts or
# rejects it), changing it silently weakens a check, and no other pin would
# notice. That is the whole test, and it is why the list is short.
#
# WHY refresh is a separate command: `npm run check` must never be able to make
# itself pass. Only `npm run gates:refresh` re-pins; it prints what moved and
# refuses to write a pin for a file it cannot find.
#
# KNOWN LIMIT, stated rather than hidden: scripts/gates.mjs is the program that
# reads this file, and it is deliberately NOT pinned here. A verifier cannot
# check its own hash without writing it, and writing it changes the hash — so
# listing itself would either fail forever or need an exemption, and an
# exemption is exactly the hole this file exists to close. Its protection is
# therefore Layer 2 alone: .github/CODEOWNERS names it explicitly. If you are
# reading this to find the soft spot in the design, that file is it, and the
# honest answer is that closing it needs branch protection, not another hash.
#
# FORMAT: <path> <40-hex git blob sha1>. Re-pinning is a reviewed act: write the
# new hash here and say in the commit why the criterion it enforces did or did
# not change. A pin with no stated reason is an obstacle to be routed around.

# --- what "correct" means at the repo level ---
# ────────────────────────────────────────────────────────────────────────────
# HOW A CHANGE TO THIS SITE IS PROVED
# ────────────────────────────────────────────────────────────────────────────
#
# A test cannot tell you a page looks wrong. Every gate in this repository can go
# green while the page is unreadable, because "unreadable" is not a property any of
# them can compute. This is the one rule that is not a gate, and it is the one that
# catches what the gates cannot.
#
# 1. OPEN IT. A change to landing/ is finished when the page has been rendered in a
#    real browser and looked at, not when the suite is green. Screenshot it. A
#    change that was never opened has not been made.
#
# 2. NAME WHAT IS WRONG, BEFORE FIXING IT. Open the page and write down the defect
#    with its measurement — "the hero sits 250px above the cards", "the nav wraps
#    'Model Anda' across two lines at 1600px", "the container uses 61% of a
#    1920px window". A defect you cannot state is one you will guess at, and
#    guessing is how a page gets worse while feeling like progress.
#
# 3. COMPARE IT TO SOMETHING THAT IS ALREADY GOOD. Open the reference the work
#    imitates and see what it does with the same problem. Take the principle, never
#    the pixels.
#
#    THE BENCHMARK FOR THE DOWNLOAD TAB IS https://code.visualstudio.com/Download
#    and it is the one that decides that tab, every time, until this line changes.
#    Open it before touching landing/unduh*.html and hold it to these four:
#      - IT GIVES THE MATCHING PLATFORM THE ONLY FILLED BUTTON. Windows, macOS and
#        Linux each get one; the other builds live behind a closed "Select a
#        download…" list. A card with two equal buttons has not learned this.
#      - WHAT IS CLOSED IS CLOSED BY DEFAULT. The variants exist on the page and
#        cost the reader nothing until they ask. Five closed lists are not noise
#        because none of them is open on arrival.
#      - THE PRIMARY IS THE FILE THAT WORKS ON AN UNMANAGED MACHINE. Here that is
#        the .zip. The .crx is refused by a browser that is not policy-managed, so
#        filling it would advertise the failing path as the likely one.
#      - IT SAYS WHAT EACH BUILD IS FOR next to the button, not only in a table
#        further down.
#
#    The benchmark for the rest of the site is https://cohere.com/:
#      - its nav carries CATEGORIES (Products, Solutions, Resources, Research), and
#        its hero carries the ACTION. The two are different jobs. When a nav item
#        only repeats what the hero already says, the nav is the wrong place for it.
#      - its page fills the window it is given, and its text keeps its own measure.
#        A 980px column on a 1920px screen is a letterbox, not a design.
#      - it states one claim per line and does not qualify it in the next breath.
#
#    One more, for the tab itself at a different scale:
#    https://kilo.ai/ for a download page that names the visitor's own platform.
#
#    Copying a competitor's trade dress is infringement, and a page that looks
#    copied reads as cheap. This repository already did the right version of this —
#    Opera Agent has a passwordless magic link, which beats the password every
#    competitor asks for, and it never copied the thing that beat it.
#
# 4. WASH THE STACK. Check the change against every layer, not only the file you
#    edited. A class added to site.css lands on twelve pages, one of which styles
#    itself. That is how `.hero { min-height: 72dvh }`, written for one marketing
#    page, put a band of dead space on the download page — and no test noticed,
#    because the suite was green throughout.
#
# 5. SAY SO EVEN WHEN IT IS YOUR FAULT. A defect introduced in the same session is
#    the easiest to leave unmentioned, because fixing it is work. It is also the one
#    the next reader is least likely to find, having trusted a green run. Name it
#    in the summary, unprompted.
#
# 6. A COMMENT DOCUMENTS A DECLARATION, SO IT STANDS OUTSIDE IT.
#
#    ALLOWED: a comment above a declaration or statement at the top level of its
#    block — the file header, a function above its signature, a config key above
#    its value. It documents what comes next, and is outside it.
#
#    FORBIDDEN: a comment inside a body. Between two statements of a function,
#    inside a loop, inside an if, in the middle of a stylesheet, in the middle of a
#    SQL statement. If it is about code above, it belongs above that code; if it
#    is about code below, it belongs above that.
#
#    WHY, MEASURED: 4,036 comments in this repository, a large share of them
#    inside bodies. The cost was never the words — it was placement. A comment
#    three lines from the decision it describes stops describing it the moment the
#    code moves, and nothing notices, because a stale comment is still
#    syntactically a comment. Worse, a comment inside a body reads as permanent: it
#    looks like part of the algorithm, so nobody dares touch the block around it.
#
#    WHY THIS IS NOT NEGOTIABLE PER FILE. The rule was first written with a
#    carve-out — "runtime code, but not tests" — and the carve-out was true, and
#    still wrong, because "which files count" is the question a gate exists to
#    stop having. The scope is the repository.
#
#    WHAT WAS LOST, SAID PLAINLY: removing the comments also removed 705 lines of
#    migration notes in supabase/migrations/ that recorded why each migration
#    exists, including the measurements behind them. That history is now only in
#    git. This is the accepted cost of the rule, not an oversight.
#
#    ENFORCED BY: tests/comment-placement.test.mjs — every tracked AND untracked
#    file, in every language, with a scanner that tells a comment from a string and
#    from a regex literal. The form of a comment is a separate rule with its own
#    gate, tests/comment-format.test.mjs; two gates asserting one property is one
#    gate too many to keep honest.
#
# 7. A LOCK ANCHORS ON CODE, NEVER ON A COMMENT.
#
#    Six tests used a decorative comment as a structural marker — "// Action
#    Pipeline", "// Burst ref passthrough", "// ---- Event-Triggered Workflows" —
#    to slice a source file. They passed on code nobody could read and would have
#    failed the moment the banner was reworded, which is not a contract change.
#    A lock names the code it protects: a function signature, a constant, a call.
#
#    The same rule applies to digests. A digest over raw source text pins the
#    formatting as much as the contract, so a comment edit moves the pin and the
#    lock teaches people to re-pin without reading. Normalise first, then hash:
#    tests/helpers/canonical-source-hash.mjs strips the comment lines and collapses
#    the whitespace before hashing a tool schema, so the pin holds the tool's
#    contract and not its indentation.
