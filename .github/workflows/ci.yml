name: CI

# Three jobs, all on the self-hosted Windows runner. Reduced 2026-10-04 from
# eight: the local runner sits Pending whenever it is offline, so every job was
# queued behind an unavailable machine and the queue, not the code, became the
# thing being reported. The gates kept here are the ones that fail on the
# author's own machine, so a run that starts is a run that can conclude.
#  - unit:        npm test + npm run check (fast suite, 772 tests)
#  - secret-scan: gitleaks, the one gate that cannot run locally
#  - browser:     Brave harness, the one gate needing a real browser
# WHY the env var: this machine's global git config rewrites every
# https://github.com URL to SSH (url.ssh://git@github.com.insteadOf), so
# checkout died with "Host key verification failed". Bypassing the global config
# keeps the fetch on HTTPS; checkout embeds the job token, so no credential
# helper is needed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_GLOBAL: /dev/null

defaults:
  run:
    shell: bash

jobs:
  unit:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Unit and static tests
        run: |
          npm test
          npm run check

  secret-scan:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan (gitleaks)
        run: |
          GITLEAKS_VERSION="8.24.0"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_windows_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          mkdir -p /tmp/gitleaks-bin
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks.exe
          /tmp/gitleaks-bin/gitleaks.exe detect --source . --verbose

  browser:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser harness (Brave, headed)
        run: |
          py tests/browser_extension_test.py
