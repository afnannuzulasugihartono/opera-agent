# @last-edited: 2026-10-04 21:12 UTC+7.
# @title: ci — Three jobs, all on one self-hosted Windows runner.
# @context: CI.
# @state: the Node gate runs on ubuntu-latest; the other two need this machine.
# @updated: every file carries Last edited, Title, Purpose and Now
# @dependencies: none stated.

name: CI

# Three jobs. The Node gate runs on GitHub's own Linux runner; the two that need
# this machine stay on it.
#  - unit:        npm test + npm run check, on ubuntu-latest
#  - secret-scan: gitleaks, the one gate that cannot run locally
#  - browser:     Brave harness, the only job that needs Python
#
# WHY unit moved off the self-hosted runner. It needs Node and nothing else, and
# while the laptop is offline it queued for hours with no result at all, so every
# commit in the session had zero CI evidence. On Linux it also proves something the
# repo never has: that the Node suite is platform-neutral rather than only ever
# correct on one Windows machine. secret-scan and browser stay put because gitleaks
# is downloaded as a windows zip and the harness needs this machine's browsers.
#
# WHY every job has a timeout. There is a single runner for two of them, so one hung
# job blocks the other. Measured: actions/setup-python removed the tool-cache Python
# and then its installer sat at zero CPU for two hours, holding the runner, and ten
# pushes queued behind it with no result at all. A timeout turns that silent block
# into a failure and frees the machine.
#
# WHY the concurrency group. Ten commits pushed in a session is ten runs of the same
# gates. Only the newest head can be the acceptance evidence, so superseded runs are
# cancelled rather than queued behind each other.
#
# WHY the env var: this machine's global git config rewrites every
# https://github.com URL to SSH (url.ssh://git@github.com.insteadOf), so
# checkout died with "Host key verification failed". Bypassing the global config
# keeps the fetch on HTTPS; checkout embeds the job token, so no credential
# helper is needed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_GLOBAL: /dev/null

defaults:
  run:

    # WHY pwsh. The bare name `bash` resolves to C:\Windows\System32\bash.exe, the WSL
    # launcher, and this runner has no WSL distribution: every job died in under a
    # second with "Windows Subsystem for Linux has no installed distributions" without
    # running a command. Pointing at Git Bash instead failed differently, on MSYS path
    # mangling of the runner's own arguments. PowerShell 7 is installed and needs no
    # path translation, so the steps are written for it.

    shell: pwsh

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Unit and static tests
        run: |
          npm test
          npm run check

  secret-scan:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan (gitleaks)
        run: |
          $ErrorActionPreference = 'Stop'

          # WHY zip and not tar.gz: gitleaks publishes windows_x64 as a zip. The
          # tar.gz name 404s, and the step had never run before because the shell
          # itself was broken, so the wrong name went unnoticed.

          $version = '8.24.0'
          $zip = Join-Path $env:RUNNER_TEMP 'gitleaks.zip'
          $bin = Join-Path $env:RUNNER_TEMP 'gitleaks-bin'
          Invoke-WebRequest -Uri "https://github.com/gitleaks/gitleaks/releases/download/v$version/gitleaks_${version}_windows_x64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $bin -Force
          & (Join-Path $bin 'gitleaks.exe') detect --source . --verbose

  browser:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # WHY no setup-python: on this host the python.org installer never completes.
      # It has sat at zero CPU for over two hours holding the only runner, and
      # because there is a single runner that also blocked the unit and secret-scan
      # jobs, which need no Python at all. The machine already provides Python 3.13
      # with playwright on the user PATH, and `py` resolves to it, so the harness
      # runs the same code against the same interpreter the local gates use.
      # Restore the pin once the installer works on this machine.

      - name: Show the interpreter the harness will use
        run: |
          py -c "import sys, playwright; print(sys.version.split()[0], 'playwright ok')"
      - name: Browser harness (Brave, headed)
        run: |
          py tests/browser_extension_test.py
