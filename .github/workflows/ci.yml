# @last-edited: 2026-10-22 UTC+7.
# @title: ci — three jobs, all on GitHub Linux runners.
# @state: all three gates run on every pull request, whatever it targets, and on a push to main.
# @dependencies: none stated.

name: CI

# WHY THE BROWSER JOB KEEPS ITS RECORD.
# The harness writes its whole record to one file, and the step log keeps only the first pages of it, so a failure arrived with nothing to read.
# The record is the evidence of what the browser did, and it has to survive the run that produced it.

# WHY EVERY PULL REQUEST, WHATEVER BRANCH IT TARGETS.
# The stack in this repository is a chain of branches, and a gate that only runs against main runs for none of them: the pull requests that carry the work would show no gate at all, and the owner would be the only check.
# WHY THE TOOLCHAIN INSTALLS FIRST.
# The shared core is strict TypeScript, and `npm test` compiles it at pretest (build-shared); a clean checkout carries no node_modules, so the compile cannot even start until the toolchain is on the runner.
# The install is `npm install` by design: the tree never tracks package-lock.json, a dependency is resolved fresh from package.json rather than pinned to a lock it does not carry.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:

    shell: pwsh

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
      - name: Install the toolchain
        run: npm install --no-audit --no-fund
      - name: Unit and static tests
        run: |
          npm test
          npm run check

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Secret scan (gitleaks)
        run: |
          set -euo pipefail

          version=8.24.0
          curl -sSfL -o "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" detect --source . --verbose

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install playwright and its chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Show the interpreter the harness will use
        run: |
          python -c "import sys, playwright; print(sys.version.split()[0], 'playwright ok')"
      - name: Browser harness (playwright chromium under xvfb)
        env:

          OA_BROWSER_HEADLESS: '0'

        run: |
          xvfb-run -a python tests/browser_extension_test.py > "${RUNNER_TEMP}/harness.json"
          cat "${RUNNER_TEMP}/harness.json"

      - name: Keep the harness record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-harness
          path: ${{ runner.temp }}/harness.json
          if-no-files-found: ignore
