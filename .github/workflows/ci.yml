# @last-edited: 2026-10-04 21:34 UTC+7.
# @title: ci — three jobs; two on GitHub Linux, the browser one on this machine.
# @context: CI.
# @state: unit and secret-scan run on ubuntu-latest; browser needs this machine.
# @updated: every file carries Last edited, Title, Purpose and Now
# @dependencies: none stated.

name: CI

# Three jobs. Two run on GitHub's own Linux runner; the one that needs this machine
# stays on it.
#  - unit:        npm test + npm run check, on ubuntu-latest
#  - secret-scan: gitleaks, the one gate that cannot run locally, on ubuntu-latest
#  - browser:     Brave harness, the only job that needs Python and this machine
#
# WHY unit and secret-scan moved off the self-hosted runner. Neither needs anything
# this laptop has: unit needs Node, and the secret scan needs the tree. While the
# runner was offline they queued for hours with no result at all, so every commit in
# the session had zero CI evidence. On Linux they also prove something the repo never
# has: that the Node suite is platform-neutral rather than only ever correct on one
# Windows machine. Only browser stays, because it drives this machine's browsers.
#
# WHY every job has a timeout. There is a single runner for two of them, so one hung
# job blocks the other. Measured: actions/setup-python removed the tool-cache Python
# and then its installer sat at zero CPU for two hours, holding the runner, and ten
# pushes queued behind it with no result at all. A timeout turns that silent block
# into a failure and frees the machine.
#
# WHY the concurrency group. Ten commits pushed in a session is ten runs of the same
# gates. Only the newest head can be the acceptance evidence, so superseded runs are
# cancelled rather than queued behind each other.
#
# WHY the env var lives on the browser job: this machine's global git config
# rewrites every https://github.com URL to SSH
# (url.ssh://git@github.com.insteadOf), so checkout died with "Host key
# verification failed". Bypassing the global config keeps the fetch on HTTPS;
# checkout embeds the job token, so no credential helper is needed. It is not
# workflow-wide because /dev/null is a Windows idiom that breaks git on Linux.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:

    # WHY pwsh. The bare name `bash` resolves to C:\Windows\System32\bash.exe, the WSL
    # launcher, and the Windows runner has no WSL distribution: every job died in under a
    # second with "Windows Subsystem for Linux has no installed distributions" without
    # running a command. Pointing at Git Bash instead failed differently, on MSYS path
    # mangling of the runner's own arguments. PowerShell 7 is installed and needs no
    # path translation, so the Windows job is written for it. The two Linux jobs
    # override this back to bash: pwsh exists on the Linux image, but its output came
    # back as undecodable bytes and its failures were unreadable, which is the worst
    # way to run a gate.

    shell: pwsh

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Unit and static tests
        run: |
          npm test
          npm run check

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan (gitleaks)
        run: |
          set -euo pipefail

          # WHY the linux tarball: the gate scans the tree, not the machine, so it
          # has no reason to need this laptop. gitleaks publishes linux_x64 as a
          # tar.gz and windows_x64 as a zip, and the artifact name has to match the
          # runner or the download 404s.

          version=8.24.0
          curl -sSfL -o "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" detect --source . --verbose

  browser:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:

      # WHY here and not workflow-wide. This machine's global git config rewrites
      # https://github.com to SSH, so checkout needs the global config out of the
      # way. Pointing it at /dev/null is a Windows idiom: on Linux every git config
      # call then fails with "could not lock config file /dev/null", so the Linux
      # jobs must not inherit it.

      GIT_CONFIG_GLOBAL: /dev/null

    steps:
      - uses: actions/checkout@v4

      # WHY no setup-python: on this host the python.org installer never completes.
      # It has sat at zero CPU for over two hours holding the only runner, and
      # because there is a single runner that also blocked the unit and secret-scan
      # jobs, which need no Python at all. The machine already provides Python 3.13
      # with playwright on the user PATH, and `py` resolves to it, so the harness
      # runs the same code against the same interpreter the local gates use.
      # Restore the pin once the installer works on this machine.

      - name: Show the interpreter the harness will use
        run: |
          py -c "import sys, playwright; print(sys.version.split()[0], 'playwright ok')"
      - name: Browser harness (Brave, headed)
        run: |
          py tests/browser_extension_test.py
