# @last-edited: 2026-10-04 18:25 UTC+7.
# @title: release — Repository file.
# @state: verify current signed release identity (#14).
# @dependencies: none stated.

name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'release-trigger/**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG=v${VERSION}" >> "$GITHUB_ENV"

      - name: Validate
        run: |
          npm test
          npm run check
          node -e "const p=require('./package.json'); const m=require('./extension/manifest.json'); if(p.version!==process.env.VERSION||m.version!==process.env.VERSION) process.exit(1)"

      - name: Package extension and source
        shell: bash
        run: |
          (cd extension && zip -r "../Opera-Agent-${VERSION}-extension.zip" .)
          git archive --format=zip --output="Opera-Agent-${VERSION}-source.zip" HEAD

      # WHY the id is derived here and not written down: the CRX lives under the
      # path named after the extension id, and Chrome derives that id from the
      # manifest key. Hardcoding it is how the 1.6.15 release ended up fetching a
      # 404 while the CRX itself was published correctly.

      - name: Fetch and verify signed CRX
        shell: bash
        run: |
          EXTENSION_ID="$(node -e "
            const crypto = require('node:crypto');
            const manifest = require('./extension/manifest.json');
            const digest = crypto.createHash('sha256')
              .update(Buffer.from(manifest.key, 'base64')).digest().subarray(0, 16);
            process.stdout.write([...digest]
              .map((b) => String.fromCharCode(97 + (b >> 4)) + String.fromCharCode(97 + (b & 15)))
              .join(''));
          ")"
          echo "extension id: ${EXTENSION_ID}"
          curl --fail --silent --show-error --location \
            --dump-header "${RUNNER_TEMP}/crx.headers" \
            "https://nenmkmtvjremqphfqnfw.supabase.co/functions/v1/opera-agent-update/opera-agent-${EXTENSION_ID}-${VERSION}.crx" \
            --output "Opera-Agent-${VERSION}.crx"

          # WHY compare against the served ETag and not a file in the tree: the
          # update function already publishes the digest it stored, so the bytes
          # just downloaded can be checked against the same value the browser will
          # cache. docs/releases/ held these digests once and was deleted, which is
          # what left this step asserting a file that no longer existed.

          EXPECTED="$(grep -i '^etag:' "${RUNNER_TEMP}/crx.headers" | tr -d '\r"' | sed 's/^[Ee][Tt][Aa][Gg]: *//')"
          ACTUAL="$(sha256sum "Opera-Agent-${VERSION}.crx" | cut -d' ' -f1)"
          echo "expected ${EXPECTED}"
          echo "actual   ${ACTUAL}"
          test -n "$EXPECTED" && test "$EXPECTED" = "$ACTUAL"

      - name: Generate checksums
        shell: bash
        run: |
          sha256sum \
            "Opera-Agent-${VERSION}-extension.zip" \
            "Opera-Agent-${VERSION}-source.zip" \
            "Opera-Agent-${VERSION}.crx" > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NOTES="docs/releases/${VERSION}.md"
          if [ ! -f "$NOTES" ]; then NOTES="CHANGELOG.md"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "Opera-Agent-${VERSION}-extension.zip" \
              "Opera-Agent-${VERSION}-source.zip" \
              "Opera-Agent-${VERSION}.crx" \
              SHA256SUMS --clobber
          else
            gh release create "$TAG" \
              "Opera-Agent-${VERSION}-extension.zip" \
              "Opera-Agent-${VERSION}-source.zip" \
              "Opera-Agent-${VERSION}.crx" \
              SHA256SUMS \
              --target "$GITHUB_SHA" \
              --title "Opera Agent ${VERSION}" \
              --notes-file "$NOTES"
          fi
