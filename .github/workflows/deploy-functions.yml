# @last-edited: 2026-11-12 UTC+7.
# @title: deploy-functions - deploys the edge functions in hosted/functions/, on dispatch.
# @state: what is being deployed, by whom, against which project, is decided here; the run answers with the exact project and function it touched.
# @dependencies: SUPABASE_ACCESS_TOKEN secret, supabase/setup-cli.

# WHY THIS EXISTS.
# The everyday machine was the only place that could deploy an edge function - the `supabase` CLI login on it went stale, and a stale login is not a finding, it is a wall.
# This workflow does the same job from CI, with a token the owner already keeps in GitHub Secrets for the publish-crx release flow, so a deploy is one dispatch and one sentence in the log.
# WHY ONLY ON DISPATCH.
# A merge that ships a function without being asked to would deploy it before the owner reads the diff; dispatch-only makes the deployment an explicit act, exactly like publish-crx.
# WHY THE BUILD RUNS HERE.
# The functions statically import ../../../shared/*.js; the tree carries only the strict .ts sources - the emitted twins are never committed, so a fresh checkout must compile them before the CLI bundles a function that reads them.
# WHY THE SHA, NOT A TAG: supabase/setup-cli is pinned to 689adcfb80d947100a1eab127289b97d1fb07b13 (v3.2.0); move it deliberately.

# WHY THE DEPLOY STEP BUILDS A COMPATIBILITY LAYOUT.
# The CLI bundles each function from <cwd>/supabase/functions/<name>/index.ts and resolves the shared core as <cwd>/shared since the restructure flattened it to the repository root, so the deploy could not open its entrypoint and exited 1 on a tree that was correct.
# The compatibility layout is built in the runner, not committed to the repo: hosted/supabase/functions is a symlink to hosted/functions and hosted/shared is a symlink to the repository root's shared, both created and discarded inside the one step, so the repo stays one layout and the runner speaks the CLI's dialect.

name: Deploy functions

on:
  workflow_dispatch:
    inputs:
      functions:
        description: "Edge functions to deploy, comma-separated (default: opera-agent-mcp)."
        required: false
        default: 'opera-agent-mcp'
        type: string
      reason:
        description: What is being deployed and why, for the deployment log.
        required: false
        type: string

concurrency:
  group: deploy-functions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy the edge functions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0

      - name: Build the shared core
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:shared

      - name: The version matches the manifest
        shell: bash
        run: |
          MANIFEST="$(node -p "require('./extension/manifest.json').version")"
          MCP="$(grep -o 'SERVER_VERSION = "[0-9.]*"' hosted/functions/opera-agent-mcp/index.ts | cut -d'"' -f2)"
          echo "extension manifest: ${MANIFEST}"
          echo "edge function SERVER_VERSION: ${MCP}"
          if [ "${MANIFEST}" != "${MCP}" ]; then
            echo "::error::the extension manifest says ${MANIFEST} and the edge function carries SERVER_VERSION ${MCP}; refusing to deploy a mismatched pair"
            exit 1
          fi

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13

      - name: Deploy
        working-directory: hosted
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: nenmkmtvjremqphfqnfw
          FUNCTIONS: ${{ inputs.functions }}
        shell: bash
        run: |
          mkdir -p supabase
          ln -sfn ../functions supabase/functions
          ln -sfn ../../shared shared
          IFS=',' read -ra ARRAY <<< "$FUNCTIONS"
          for f in "${ARRAY[@]}"; do
            f="$(echo "$f" | xargs)"
            echo "::group::deploying $f"
            supabase functions deploy "$f" --project-ref "$PROJECT_ID" --yes
            echo "::endgroup::"
          done

      - name: Confirm the MCP health answers
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            --proto '=https' --proto-redir '=https' \
            --output /dev/null --write-out 'status %{http_code}\n' \
            https://nenmkmtvjremqphfqnfw.supabase.co/functions/v1/opera-agent-mcp/health
