# @last-edited: 2026-10-06 02:34 UTC+7.
# @title: deploy-site — publishes landing/ to Cloudflare Pages when dispatched.
# @state: manual only; CI runs on every push and this decides when the site moves.
# @dependencies: wrangler, the landing directory, CF_TOKEN and CF_ACCOUNT_ID secrets.

name: Deploy site

# WHY this exists rather than a Cloudflare Git integration: a Direct Upload
# project cannot be switched to Git integration later, and Vercel Hobby allows a
# hundred deployments a day, which a busy main spends on its own. This is the
# documented "Direct Upload with continuous integration" path, so the repo owns
# the decision rather than a provider's build pipeline.
#
# WHY manual and not on every push: a deploy is a publication, and publishing a
# one-word copy change to a stranger-facing site is not worth a build. CI still
# runs on every push; this only decides when the site itself moves. The reason
# input is free text for the deployment log, because the log is where the next
# reader asks what shipped.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: What changed, for the deployment log.
        required: false
        type: string

concurrency:

  # WHY one at a time: a newer dispatch must not interleave with a deployment
  # already in flight, or the edge ends up serving the older of the two.

  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish landing to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0

      - name: Unit gate
        run: npm test

      - name: Syntax gate
        run: npm run check

      # WHY the gates run here and not as a dependency: this workflow may be
      # dispatched on a head whose CI run has not finished, and the tree it is
      # about to publish is the one that has to hold.

      - name: Publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CF_TOKEN and CF_ACCOUNT_ID are unset; not publishing from a guess"
            exit 1
          fi
          npx --yes wrangler@latest pages deploy landing \
            --project-name=opera-agent \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="${{ inputs.reason || format('deploy {0}', github.sha) }}"

      # WHY read the served bytes: a deploy can report success while the edge still
      # answers with an earlier copy, and only the response tells the two apart.

      - name: Confirm the site answers
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 \
            --output /dev/null --write-out 'status %{http_code}\n' \
            https://opera-agent.pages.dev/