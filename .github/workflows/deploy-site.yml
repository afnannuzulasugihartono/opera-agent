# @last-edited: 2026-10-06 02:34 UTC+7.
# @title: deploy-site — publishes landing/ to Cloudflare Pages when dispatched.
# @state: manual only; CI runs on every push and this decides when the site moves.
# @dependencies: wrangler, the landing directory, CF_TOKEN and CF_ACCOUNT_ID secrets.

name: Deploy site

on:
  workflow_dispatch:
    inputs:
      reason:
        description: What changed, for the deployment log.
        required: false
        type: string

concurrency:

  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish landing to Cloudflare Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0

      - name: Unit gate
        run: npm test

      - name: Syntax gate
        run: npm run check

      - name: Publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CF_TOKEN and CF_ACCOUNT_ID are unset; not publishing from a guess"
            exit 1
          fi
          npx --yes wrangler@latest pages deploy landing \
            --project-name=opera-agent \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="${{ inputs.reason || format('deploy {0}', github.sha) }}"

      - name: Confirm the site answers
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 \
            --output /dev/null --write-out 'status %{http_code}\n' \
            https://opera-agent.pages.dev/