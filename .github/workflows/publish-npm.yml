# @last-edited: 2026-11-11 UTC+7.
# @title: publish-npm - publishes the local MCP package with the runner's own identity.
# @state: the version it publishes, the gates it waits for, and the registry answer it confirms.
# @dependencies: npm trusted publishing (OIDC), the package in local/.
# WHY THE RUNNER INSTALLS npm@11: node 22 ships npm 10, which cannot do the OIDC exchange the trusted publisher needs; npm >= 11.5.1 is required, and without it the PUT leaves without a token and the registry answers 404.

# WHY THIS PUBLISHES WITHOUT A TOKEN.

# WHY THIS PUBLISHES WITHOUT A TOKEN.
# npm is restricting the tokens that bypass two-factor authentication, and direct publishing with one ends in January 2027.
# Trusted publishing replaces the token with the runner's own identity: the workflow asks GitHub for a signed token, npm reads the repository and the workflow out of it, and nothing is stored on any machine.
# So the identity lives in the npm package settings (GitHub Actions: afnannuzulasugihartono / opera-agent / publish-npm.yml) and this file is the other half of that pair.

name: Publish npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to publish, matching local/package.json.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the package with the runner identity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
          registry-url: https://registry.npmjs.org

      - name: The runner's npm can speak OIDC
        run: npm install --global --ignore-scripts npm@11.5.1 && npm --version

      - name: The version in the tree is the version asked for
        env:
          ASKED: ${{ inputs.version }}
        run: |
          VERSION="$(node -p "require('./local/package.json').version")"
          echo "package version: ${VERSION}"
          if [ "${VERSION}" != "${ASKED}" ]; then
            echo "the package says ${VERSION} and the dispatch asked for ${ASKED}"
            exit 1
          fi

      - name: The gates are green before anything is published
        # WHY THE INSTALL IS HERE FIRST.
        # `npm test` compiles the TypeScript (pretest) and then biome and the auditors walk the tree; none of those binaries exist on a bare runner, and the job failed at exit 127 without the toolchain ever installing.
        # CI installs first for the same reason (ci.yml "Install the toolchain"), and a publish that never reaches the registry is what a gate that cannot run proves.
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run check

      - name: Pack the package and show what it carries
        working-directory: local
        run: npm pack --dry-run

      - name: Publish with provenance
        working-directory: local
        run: npm publish --provenance --access public

      - name: The registry answers with the version
        run: |
          VERSION="$(node -p "require('./local/package.json').version")"
          for attempt in $(seq 1 40); do
            PUBLISHED="$(npm view opera-agent-mcp@${VERSION} version 2>/dev/null || true)"
            echo "attempt ${attempt}: registry says: ${PUBLISHED:-nothing}"
            if [ "${PUBLISHED}" = "${VERSION}" ]; then
              echo "registry answers ${VERSION}"
              exit 0
            fi
            sleep 15
          done
          echo "the registry does not answer ${VERSION} yet"
          exit 1
