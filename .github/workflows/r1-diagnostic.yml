name: R1 diagnostic

on:
  push:
    branches:
      - feat/pre-8e-usability-repair-r1
  pull_request:
    branches:
      - test/pre-8e-usability-repair-r0

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip playwright
      - run: python -m playwright install --with-deps chromium
      - run: xvfb-run -a env OA_BROWSER_HEADLESS=0 python tests/browser_extension_test.py
